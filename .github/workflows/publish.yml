name: Publish to npm

# Publishes @cdatasoftware/create-agent to npmjs.org when a Release is
# published on GitHub. Auth is via npm Trusted Publishing — the
# workflow's GitHub OIDC identity is exchanged for a one-time publish
# credential at runtime, so there is no token to store or rotate.
#
# Setup required once on npmjs.org (org owner):
#   Package settings → Trusted Publishers → Add GitHub Actions
#     Repository:        CDataSoftware/connect-ai-sample-agents
#     Workflow filename: publish.yml
#     Environment:       npm-publish
#
# Setup required once on GitHub:
#   Settings → Environments → New environment: `npm-publish`
#     Deployment branch rule: restrict to tag pattern `v*`
#     Optional: required reviewers for approval gating

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (>=11.5.1 required for OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "Release tag:          ${GITHUB_REF_NAME}"
          echo "Tag version:          ${TAG}"
          echo "package.json version: ${PKG}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi

      # --ignore-scripts: no dep in the install tree gets to run a postinstall
      # in the same process as the npm OIDC token. Defends against the
      # compromised-transitive-dep variant of the TanStack-style attack.
      - run: npm ci --ignore-scripts

      - name: Syntax check bin/cli.js
        run: node --check bin/cli.js

      - name: Publish with provenance
        run: npm publish --provenance --access public --ignore-scripts
